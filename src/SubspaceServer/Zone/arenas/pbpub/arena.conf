; MultiPub PowerBall arena — hosts the ported PB Mod "MultiPub" public game.
;
; This arena attaches the core SS.Core.Modules.Scoring.BallGamePoints scorer plus the PowerBall display, stats and
; extras modules and the MultiPub controller (game-type voting: Small Pub / 3H / Mini, team randomize, side-game
; routing). The soccer and MultiPub values follow the live PowerBall zone's public arena; the map is the
; development map in this repository rather than the zone's (public).lvl.

; Start with the shared, standard settings as a baseline.
#include conf/svs-pb/svs.conf

[ General ]
Map = pbg3d.lvl

[ Misc ]
SeeEnergy = Team
SpecSeeEnergy = All
FrequencyShipTypes = 1
GreetMessage = Welcome to PowerBall Zone!

[ Modules ]
; The core Scoring.BallGamePoints scorer registers IBallGamePoints, honors the per-ball Soccer:CustomGame bitmask,
; and fires the BallGameStart/BallGameOver callbacks the PowerBall modules rely on. MultiPub is the public-arena
; controller.
;
; The side-games (ScrambleGame / ProBallGame / Small4TeamGame) are code-complete but dormant here, because this map
; has no side-game fields. To run them as the live zone does, use a map that has them (the zone's (public).lvl),
; set Soccer:BallCount = 4 and Soccer:CustomGame = 14 below so that balls 1-3 belong to the side-games, and raise
; Team:MaxFrequency to 32 so the side-game freq bands can be joined. Then uncomment them.
AttachModules = \
	SS.Core.Modules.Scoring.BallGamePoints \
	SS.PowerBall.Modules.PowerBallLvz \
	SS.PowerBall.Modules.PowerBallStats \
	SS.PowerBall.Modules.MultiPub \
	SS.PowerBall.Modules.PowerBallExtras
;	SS.PowerBall.Modules.ScrambleGame \
;	SS.PowerBall.Modules.ProBallGame \
;	SS.PowerBall.Modules.Small4TeamGame

[ MultiPub ]
MaxPubFreq = 1
ScrambleFreq = 10
Small4TmFreq = 20
ProballFreq = 30
ScrambleCenterX = 512
ScrambleCenterY = 677
ScrambleSoccerThrowTime = 1200
ProballSoccerThrowTime = 790
Small4TmSoccerThrowTime = 1000
Small4TmCenterX = 885
Small4TmCenterY = 853
; Side-game ball ids, as in the live zone (used only when the side-game modules are attached).
ScrambleBall = 1
ProballBall = 3
ProballCapturePoints = -8
ProballWinBy = 2

#include balls.conf

; After balls.conf, which this overrides (the last value read for a key wins).
;
; The goals are on the left and right halves of the map, so the game is LeftRight: a goal is a point for the team
; attacking it. First to 6 (CapturePoints is negative, so scores count up rather than being stolen), winning by 2.
; Soccer:CustomGame is a bitmask, indexed by ball id, of balls that BallGamePoints must NOT score because a
; side-game module owns them; with no side-games active it is 0 (the live zone uses 14, for balls 1-3).
[ Soccer ]
Mode = 1
CapturePoints = -6
WinBy = 2
NewGameDelay = -2000
BallCount = 1
CustomGame = 0

; 2 teams: Freq 0 = Warbirds, Freq 1 = Javelins. MultiPub treats the freqs below PrivFreqStart - 1 as the pub teams.
[ Team ]
MaxFrequency = 2
DesiredTeams = 2
RequiredTeams = 2
RememberedTeams = 2
PrivFreqStart = 3
BalancedAgainstStart = 0
BalancedAgainstEnd = 2
DisallowTeamSpectators = 0
InitialSpec = 0
MaxPlaying = 1000
MaxPerTeam = 1000
MaxPerPrivateTeam = 0
IncludeSpectators = 0
ForceEvenTeams = 0
MaxTeamDifference = 1
