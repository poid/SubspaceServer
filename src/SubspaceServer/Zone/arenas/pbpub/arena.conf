; MultiPub PowerBall arena — hosts the ported PB Mod "MultiPub" public game.
;
; This arena attaches the PowerBall plugin's own scoring module (PowerBallGamePoints) INSTEAD of the core
; SS.Core.Modules.Scoring.BallGamePoints, plus the MultiPub controller (game-type voting: Small Pub / 3H / Mini,
; team randomize, side-game routing). The existing "pb" arena is left as-is for the plain BallGamePoints test.

; Start with the shared, standard settings as a baseline.
#include conf/svs-pb/svs.conf

[ General ]
Map = pbg3d.lvl

[ Misc ]
SeeEnergy = Team
SpecSeeEnergy = All
FrequencyShipTypes = 1
GreetMessage = Welcome to PowerBall Zone!

[ Modules ]
; The core Scoring.BallGamePoints scorer registers IBallGamePoints and honors the per-ball Soccer:CustomGame
; bitmask, and fires the BallGameStart/BallGameOver callbacks the PowerBall modules rely on. MultiPub is the
; public-arena controller.
;
; The side-games (ScrambleGame / ProBallGame / Small4TeamGame) are code-complete but dormant until the zone
; provides their ball ids + goal regions and marks those ball ids in Soccer:CustomGame (see below). Uncomment
; them once that is set up.
AttachModules = \
	SS.Core.Modules.Scoring.BallGamePoints \
	SS.PowerBall.Modules.PowerBallLvz \
	SS.PowerBall.Modules.PowerBallStats \
	SS.PowerBall.Modules.MultiPub \
	SS.PowerBall.Modules.PowerBallExtras
;	SS.PowerBall.Modules.ScrambleGame \
;	SS.PowerBall.Modules.ProBallGame \
;	SS.PowerBall.Modules.Small4TeamGame

[ MultiPub ]
MaxPubFreq = 1
ScrambleFreq = 10
Small4TmFreq = 20
ProballFreq = 30
ScrambleCenterX = 512
ScrambleCenterY = 512
ScrambleSoccerThrowTime = 1000
ProballSoccerThrowTime = 790
Small4TmSoccerThrowTime = 1000
Small4TmCenterX = 512
Small4TmCenterY = 512
; Side-game ball ids (used only when the side-game modules are attached).
ScrambleBall = 1
ProballBall = 2
ProballCapturePoints = -8
ProballWinBy = 2

; Soccer:CustomGame is a bitmask, indexed by ball id, of balls that PowerBallGamePoints must NOT score
; (a side-game module owns them). With no side-games active, this is 0. To run scramble (ball 1) and proball
; (ball 2), set CustomGame = 6 ((1<<1)|(1<<2)), raise Soccer:BallCount, and add their goal regions to the map.
[ Soccer ]
CustomGame = 0

#include balls.conf

; 2 teams: Freq 0 = Warbirds, Freq 1 = Javelins
[ Team ]
MaxFrequency = 2
DesiredTeams = 2
RequiredTeams = 2
RememberedTeams = 2
PrivFreqStart = 100
BalancedAgainstStart = 0
BalancedAgainstEnd = 2
DisallowTeamSpectators = 0
InitialSpec = 0
MaxPlaying = 1000
MaxPerTeam = 1000
MaxPerPrivateTeam = 0
IncludeSpectators = 0
ForceEvenTeams = 0
MaxTeamDifference = 1
