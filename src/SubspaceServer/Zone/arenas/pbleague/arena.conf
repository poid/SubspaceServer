; League PowerBall arena — hosts the ported PB Mod "league" flow (drafting + timed matches + golden goal).
;
; Requirements:
;  - PostgreSQL: set [SS.PowerBall] DatabaseConnectionString in global.conf (used by SignUps and Teams).
;  - The map must define the regions Goal0, Goal1, Start0, Start1 (used by PowerBallLeague to warp the two teams
;    to their start areas). The pb test map may not have Start0/Start1; add them or the teams get a random warp.

; Start with the shared, standard settings as a baseline.
#include conf/svs-pb/svs.conf

[ General ]
Map = pbg3d.lvl

[ Misc ]
SeeEnergy = Team
SpecSeeEnergy = All
FrequencyShipTypes = 1
GreetMessage = Welcome to League PowerBall!

[ Modules ]
; Core scorer (registers IBallGamePoints, fires BallGameStart/Over). Then the shared PB display/stats/extras, the
; sign-up + teams drafting subsystem, and the league match orchestration.
AttachModules = \
	SS.Core.Modules.Scoring.BallGamePoints \
	SS.PowerBall.Modules.PowerBallLvz \
	SS.PowerBall.Modules.PowerBallStats \
	SS.PowerBall.Modules.PowerBallExtras \
	SS.PowerBall.Modules.SignUps \
	SS.PowerBall.Modules.Teams \
	SS.PowerBall.Modules.PowerBallLeague

[ Teams ]
; Match length in seconds (used by PowerBallLeague when the game starts). 0 = untimed.
GameTime = 600
; Max picked players per team / max in-game per team. Blank/<=0 = unlimited.
TeamMax = 8
TeamInGameMax = 8
; Pick order: 1=Free, 2=Normal, 3=Snake, 4=Random.
PickingType = 3
; Draft (players go to spec) vs pick (players go in-game).
IsDraft = 0
; Put removed/released players back on the sign-up list.
RepopulateSignups = 1

[ Soccer ]
; On a tie at time-up: negative = add that many seconds of extra time; positive = golden goal; 0 = end the game.
GoldenGoalRule = 0

#include balls.conf

; 2 teams: Freq 0 = Warbirds, Freq 1 = Javelins
[ Team ]
MaxFrequency = 100
DesiredTeams = 2
RequiredTeams = 2
PrivFreqStart = 0
InitialSpec = 1
MaxPlaying = 1000
MaxPerTeam = 1000
