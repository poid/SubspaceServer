[ General ]

;; A list of public arenas (base arena names) that the server should place players in when a specific arena is not requested.
;; Allowed delimiters include: ' ' (space), ',', ':', and ';'.
;; When omitted, the server will use the default public arena names: "0", "1", ...
;; which on the client-side respectively are displayed as "(Public 0)", "(Public 1)", ...
;; This setting works in conjunction with each arena's the General:DesiredPlaying arena.conf setting.
;; This requires the SS.Core.Modules.ArenaPlaceMultiPub module.
;PublicArenas = turf pb

;; The most players allowed in one arena when Net:UseArenaLocalPlayerIds is on.
;; It cannot exceed 256, because that is where the compact position packet's one byte id runs out and
;; the saving disappears. The default leaves a gap below that so a slot freed by someone leaving can
;; be left alone for a couple of seconds before being reused, which stops a position packet still in
;; flight from arriving named after whoever took the slot next.
;; Has no effect while Net:UseArenaLocalPlayerIds is off.
MaxPlayers = 240


[ Arenas ]

;; Names of arenas to permanently keep running.
;; These arenas will be created when the server is started
;; and show up on the arena list, even if no players are in them.
PermanentArenas = 2v2pub 3v3pub 4v4pub 4v4caps duel jackpot king pb rabbit running speed turf warzone


;; The syntax for these is:
;; [log_whatever]
;; modulename = DIMWE
;; The value tells which log levels to log:
;; D = debug, I = info, M = malicious, W = warning, E = error
;; They MUST be in caps.
;; The modulename can be "all" to catch unmatched modules.
;; If you don't filter it out, it's enabled by default.

;; For the SS.Core.Modules.LogConsole module which writes to the console.
[ log_console ]
all = DIMWE

;; For the SS.Core.Modules.LogFile module which writes to a file.
[ log_file ]
all = IMWE
persist = MWE
chat = DIMWE

;; For the SS.Core.Modules.LogSysop module, for notifying logged-in staff via chat messages.
[ log_sysop ]
all = ME

;; For the SS.Core.Modules.LogSysop module, for logs that can be seen with the ?lastlog command.
[ log_lastlog ]
all = DIMWE


;; Even though "log_staff" begins with the name "log_", it is completely unrelated to those sections.
;; This requires the SS.Core.Modules.CommandWatch module. In ASSS, the module was named log_staff, hence the section name.
;; The section name was kept the same to stay compatible with conf files created for ASSS.
[ log_staff ]
;; A list of commands that trigger messages to all logged-in staff.
commands = warn kick setcm


;; Configure the endpoints to listen on.
;; Port - The "game" UDP port that clients communicate to the server on.
;;        Note, there is always a corresponding "ping" port which is the "game" port + 1.
;; BindAddress - IP address to listen on. Leave it empty to listen on all available.
;; AllowVIE - whether to allow VIE clients
;; AllowCont - whether to allow Continuum clients
;; ConnectAs - The arena players are sent to when joining.

;; The main listening endpoint
[ Listen ]
Port = 5000
BindAddress = 
AllowVIE = 1
AllowCont = 1
ConnectAs = 

;; It is also possible to listen on additional endpoints using [Listen1], [Listen2], ...
;; Though, it is recommended to just have the single [Listen] endpoint (no number).
;; Here's a commented out example of what having additional endpoints could look like.
;; Notice the how port numbers purposely skip over the "ping" port of the prior endpoint.

;[ Listen1 ]
;Port = 5002
;BindAddress = 
;AllowVIE = 1
;AllowCont = 1
;ConnectAs = turf

;[ Listen2 ]
;Port = 5004
;BindAddress = 
;AllowVIE = 1
;AllowCont = 1
;ConnectAs = pb


[ Net ]

;; Which value to return in the simple ping response (Subspace and Continuum clients).
;; 1 = Total player count (default)
;; 2 = # of players playing, in ships
;; 3 = Alternate between Total and Playing
SimplePingPopulationMode = 1

;; Whether the player ids sent to clients are per arena rather than zone-wide.
;; Zone-wide ids are what this server has always sent and what ASSS sends. They cost bandwidth once a
;; zone gets large: the compact position packet carries the id in one byte and the batched one in ten
;; bits, so above 1023 players online every position update falls back to a packet roughly twice the
;; size. Measured, a Continuum client is sent 11.3 bytes per update below id 256 and 21 above 1023.
;; Per arena ids keep every id small no matter how many are online, which halves the outbound
;; bandwidth of the thing the server spends most of its bandwidth on.
;;
;; This changes what clients are told, so it is off by default.
;;
;; Checked by hand against a real Continuum 0.40 client: entering an arena, switching between arenas
;; repeatedly while the server gave a different id each time, the player list, position updates,
;; spectating, private messages, turret attach, kills, and flag pickup and drop all behaved. The
;; client rebuilds its player table on arena entry rather than carrying it across, which was the main
;; worry.
;;
;; What has NOT been checked is anything that needs a second real client to observe: banners, crowns,
;; greens and score updates all carry ids and no fake player can confirm them, because fake players
;; never receive packets. Worth doing before turning this on for real players. Note that a client
;; simply ignores an id it cannot resolve, so a packet with the wrong id in it shows up as nothing
;; happening rather than as an error anywhere - that is how the kill packet was missed at first.
;;
;; Requires General:MaxPlayers to be at most 256, which is where the one byte id runs out.
UseArenaLocalPlayerIds = 0

;; The TCP endpoint to listen on for the 'simple chat protocol'.
;; This requires the SS.Core.Modules.ChatNetwork module.
;; The setting can be either a port or IP:port.
;; When only a port is specified, it will listen on all network interfaces (any IP address available).
;; When the setting is omitted, the settings in the [Listen] section are used.
;; IPv6 addresses are also supported. When specifying a port with an IPv6 address, enclose the IP in square brackets [].
;;
;; For example, to listen on any available IPv6 address:
;; ChatListen = [::]:5000
ChatListen =

;; Whether packets from a player who is settled in an arena are handled on that arena's thread rather
;; than on the mainloop. Requires the SS.Core.Modules.ArenaLoop module.
;;
;; This is what stops the mainloop being the place where every packet in the zone is processed, which
;; is its remaining cost at scale: roughly six percent of a core per thousand players, and independent
;; of how those players are spread over arenas.
;;
;; Off by default, because every packet handler in the server was written when the mainloop was the
;; only thread that ran them. Turn it on in a debug build first: the threading assertions will point
;; at whatever is not safe there yet, which is the point of the setting existing at all.
HandlePacketsOnArenaThread = 0

;; How many threads to start for sending outgoing data.
;; Each one is responsible for a share of the connections, decided when a connection is made, so a
;; player's outgoing data is always handled by the same thread.
;; More are started automatically when the ones running cannot keep up, so this is a floor rather than
;; a fixed count and the default suits a server of any size. Raise it only to skip the ramp up on a
;; server that is known to start busy.
SendThreads = 1

;; The most threads allowed for sending outgoing data, or 0 to pick a number from the processor count.
;; A thread is added when every one already running has spent most of its interval working for several
;; seconds, so a zone that is quiet uses one and a zone that fills up grows into as many as it needs
;; without anyone having to be there to change a setting. Watch "send threads" in ?metrics to see it.
;; Threads are not given back when the load falls, since an idle one costs almost nothing and handing
;; a connection to a different thread could reorder that player's data.
MaxSendThreads = 0

;; How often each send thread makes a pass over its connections, in milliseconds, 5 to 100.
;; Every pass sends each connection everything queued for it since the last, merged into as few
;; datagrams as it fits, so this sets two things at once: how long a position can wait before it is
;; sent, and how many datagrams the server sends for the same positions. Ten is what the server has
;; always done. Twenty sends about half as many datagrams for the same positions, each carrying twice
;; as much, and adds up to ten milliseconds to the wait.
;; A hosted machine's network interface has a limit on packets per second that can be reached before
;; the server's threads are: measured at about 270,000 a second on one, with the send threads at half
;; load and two cores idle. This is the setting that trades latency for room under that limit.
SendInterval = 10

;; The size in bytes to ask the operating system for on each socket's send buffer, or 0 to leave it
;; at whatever the operating system defaults to.
;; The socket is non-blocking, so when the buffer is full a datagram is refused rather than waited
;; for, and the server drops it: a reliable one is resent by the reliable layer, an unreliable one is
;; a position the next one supersedes. The operating system's default is a couple of hundred
;; kilobytes, which a burst of players entering an arena fills on a real network interface, where a
;; datagram is charged to the buffer until the interface has taken it. Drops are counted in ?netstats
;; and noted in the log at most once every ten seconds.
;; The operating system silently caps this at its own maximum, and a warning is logged when it does.
;; On Linux that maximum is net.core.wmem_max and has to be raised separately.
SendBufferSize = 4194304

;; The size in bytes to ask the operating system for on each socket's receive buffer, or 0 to leave
;; it at whatever the operating system defaults to.
;; One socket carries the whole zone's incoming traffic, and the kernel charges a datagram far more
;; than its payload, so a small buffer holds only a moment of it. Anything that stops the receive
;; thread for longer loses packets, and a lost connection attempt or position looks like nothing at
;; all rather than an error. One megabyte held a fifth of a second at five thousand players and
;; overflowed while the mainloop held the player lock through a wave of ship changes; four holds
;; most of a second.
;; The operating system silently caps this at its own maximum, and a warning is logged when it does.
;; On Linux that maximum is net.core.rmem_max and has to be raised separately.
ReceiveBufferSize = 4194304


;; Server performance counters.
;; This requires the SS.Core.Modules.Metrics module.
;; Use the ?metrics command to report on demand, or ?metrics reset to restart the sampling window.
[ Metrics ]

;; Whether to collect the counters at all.
;; Collection is cheap (callers batch their reporting), so this is on whenever the module is loaded.
;; Set to 0 to remove the cost entirely without unloading the module.
Enabled = 1

;; How often to write a summary to the log (in seconds).
;; 0 to never write one automatically, in which case ?metrics reports on demand.
ReportInterval = 0


;; Settings that control the mainloop, which almost all game logic runs on.
[ Mainloop ]

;; The most work items allowed to wait in the mainloop queue at once, or 0 for no limit.
;; When the limit is reached, further work is rejected rather than queued, which sheds load instead of
;; letting latency and memory grow without bound. Rejections are counted and reported by ?metrics.
MaxQueueDepth = 0


;; Settings that control the arena worker threads, which run game logic that belongs to one arena.
;; This requires the SS.Core.Modules.ArenaLoop module.
[ ArenaLoop ]

;; How many threads to run arena work on, or 0 for the default of two.
;; Arenas are spread over the workers and each stays on the one it was given for its whole life, so
;; raising this only helps when there are more arenas than workers and they are actually busy.
;; More workers buy almost nothing. Measured at ten thousand players over a hundred arenas, each
;; driven until it could take no more: one worker carried 58,870 packets a second for 7.11 cores
;; across the server, two carried 62,614 for 8.19, and four carried 63,393 for 9.26. Four cost two
;; and a bit more cores than one for seven percent more throughput.
;; The reason it matters so little is that the mainloop backfills whatever the workers cannot take -
;; a full worker queue sends the fan-out back to it - so one worker leaves the mainloop doing 22,000
;; packets a second, two leave it 1,300 and four leave it none. The work gets done either way and
;; this mostly decides which thread does it. Two is the default because at one the mainloop is at 93%
;; doing that backfilling and it has a zone to run besides.
;; Raise it only for a zone that has measured its workers saturated AND the mainloop absorbing the
;; overflow, and even then expect little: at two workers both were true here and doubling again was
;; worth one percent. An arena also stays on the worker it was created on, so raising this does not
;; move arenas that are already busy.
;; Why spreading the same work costs more is not known. It is not the shared player lock, which was
;; the earlier explanation and did not survive being tested.
Workers = 0

;; The most work items allowed to wait in one worker's queue at once, or 0 for no limit.
;; As with Mainloop:MaxQueueDepth, only work the caller has said it can lose is refused.
;; A worker that falls behind with no limit here does not shed, it accumulates. Offered four times
;; what it could carry, one grew a two gigabyte heap and its throughput swung by sixty percent as the
;; collector worked through it; with this limit the same run held steady within nine percent on a
;; third of a gigabyte and dropped nothing, because the fan-out that is refused runs on the mainloop
;; instead. At the rate a busy worker retires items this is under a tenth of a second of backlog.
MaxQueueDepth = 2000


;; Settings for connecting the zone to a billing server.
;; This requires the SS.Core.Modules.BillingUdp module. Remember to uncomment it in the conf/Modules.config file.
[ Billing ]
IP = 127.0.0.1
Port = 9000
ServerName = Test zone
Password = billpw
ServerID = 0
GroupId = 1
ScoreId = 0


;; Settings to publish the zone on directory server(s).
;; This will publish every listen endpoint: [Listen], [Listen1], [Listen2], ... 
;; Thei requires the SS.Core.Modules.DirectoryPublisher module. Remember to uncomment it in the conf/Modules.config file.
[ Directory ]
Name = Test Zone
Description = Put your description here.
Password = 

;; List of directory servers to publish to.
Server1 = sscentral.sscuservers.net
Server2 = sscentral.trenchwars.org
Server3 = subspace.gamespec.org
Server4 = directory.poid.be

;; If you have multiple listen endpoints, then a different name and description can be provided for each endpoint's ConnectAs setting.
;; Here's a commented out example of what that could look like.
;; Notice how the section names are in the format: Directory-<ConnectAs>
;; and how the ConnectAs names match those in the prior [Listen1] and [Listen2] examples.

;[ Directory-turf ]
;Name = Test Zone (Turf)
;Description = Get off my lawn!

;[ Directory-pb ]
